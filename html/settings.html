<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --p-grad: linear-gradient(135deg, #ff6b00 0%, #ff3399 100%); 
            --bg: #0f172a; 
        }
        body { 
            display: flex; 
            background: var(--bg); 
            color: white; 
            min-height: 100vh; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            overflow-x: hidden;
        }
        aside { 
            width: 240px; 
            height: 100vh; 
            background: #1e293b; 
            padding: 30px 20px; 
            position: fixed; 
            display: flex; 
            flex-direction: column; 
            z-index: 100;
        }
        main { 
            margin-left: 240px; 
            padding: 40px 20px; 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            box-sizing: border-box;
        }
        .nav-item { 
            display: flex; 
            align-items: center; 
            padding: 12px 15px; 
            color: #94a3b8; 
            text-decoration: none; 
            border-radius: 10px; 
            margin-bottom: 5px; 
            transition: 0.2s;
        }
        .nav-item i { margin-right: 10px; font-size: 1.1rem; }
        .nav-item.active { background: var(--p-grad); color: white; }
        .logout-link { 
            width: 100%; 
            background: none; 
            border: 1px solid rgba(255,255,255,0.1); 
            color: #94a3b8; 
            padding: 15px; 
            border-radius: 10px; 
            cursor: pointer; 
            text-align: left; 
            margin-top: auto; 
            transition: 0.3s; 
        }
        .logout-link:hover { color: #ef4444; border-color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        .settings-card { 
            background: rgba(30, 41, 59, 0.5); 
            padding: 40px; 
            border-radius: 24px; 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
            box-sizing: border-box;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .btn { 
            background: #1e293b; 
            border: 1px solid #ff6b00; 
            color: white; 
            padding: 14px; 
            border-radius: 12px; 
            width: 100%; 
            cursor: pointer; 
            margin-top: 15px; 
            font-weight: 600;
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.98); }

        @media (max-width: 768px) {
            aside { 
                width: 100%; 
                height: 70px; 
                position: fixed; 
                bottom: 0; 
                top: auto; 
                flex-direction: row; 
                padding: 0; 
                justify-content: space-around; 
                align-items: center; 
                border-top: 1px solid rgba(255,255,255,0.1); 
            }
            aside h2, .logout-link { display: none; }
            main { 
                margin-left: 0; 
                padding: 20px 15px 100px 15px; 
            }
            .nav-item { 
                flex-direction: column; 
                padding: 5px; 
                font-size: 10px; 
                margin-bottom: 0; 
                background: none !important; 
            }
            .nav-item.active { color: #ff6b00; }
            .nav-item i { margin-right: 0; margin-bottom: 4px; font-size: 1.4rem; }
            .settings-card { padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <aside>
        <h2 style="font-weight: 900; margin-bottom: 30px; padding-left: 15px;">STREAK QUEST</h2>
        <nav style="display: contents;">
            <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="habits.html" class="nav-item"><i class="fa-solid fa-scroll"></i><span>Habits</span></a>
            <a href="profile.html" class="nav-item"><i class="fa-solid fa-user-shield"></i><span>Hero</span></a>
            <a href="settings.html" class="nav-item active"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
            <button id="logoutBtn" class="logout-link"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </nav>
    </aside>

    <main>
        <div class="settings-card">
            <h1 style="margin-top: 0; font-size: 28px;">Settings</h1>
            <p style="color: #94a3b8; font-size: 14px; margin-bottom: 25px;">Manage your local app data and preferences.</p>
            
            <button class="btn" onclick="localStorage.removeItem('lastCelebratedLevel'); alert('Celebration Reset!')">
                <i class="fa-solid fa-rotate-left"></i> Reset Level Celebration
            </button>
            
            <button class="btn" style="border-color: #ef4444; color: #ef4444;" onclick="if(confirm('Clear all local data?')){localStorage.clear(); alert('Cache Cleared!');}">
                <i class="fa-solid fa-trash-can"></i> Clear Local Cache
            </button>
        </div>
    </main>

    <script type="module">
        import { auth } from './firebase-config.js';
        import { signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        
        document.getElementById('logoutBtn').addEventListener('click', () => {
            if(confirm("End journey?")) signOut(auth).then(() => window.location.href = 'login.html');
        });
    </script>
</body>
</html>
